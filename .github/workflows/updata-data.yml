name: Update data

on:
  schedule:
    - cron: "0 0 * * 5"   # Fridays 00:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Commit and deploy even if the data is unchanged"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  RAW_DIR: app/public/raw_data
  PROCESSED_DIR: app/public/processed_data
  PAST_DIR: app/public/past_data
  NEW_RAW: /tmp/new_raw
  GRIPPEWEB_URL: https://raw.githubusercontent.com/robert-koch-institut/GrippeWeb_Daten_des_Wochenberichts/main/GrippeWeb_Daten_des_Wochenberichts.tsv
  ARE_URL: https://raw.githubusercontent.com/robert-koch-institut/ARE-Konsultationsinzidenz/main/ARE-Konsultationsinzidenz.tsv

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download the RKI TSV files
        run: |
          mkdir -p "$NEW_RAW"
          curl -fsSL "$GRIPPEWEB_URL" -o "$NEW_RAW/GrippeWeb_Daten_des_Wochenberichts.tsv"
          curl -fsSL "$ARE_URL" -o "$NEW_RAW/ARE-Konsultationsinzidenz.tsv"
          test -s "$NEW_RAW/GrippeWeb_Daten_des_Wochenberichts.tsv"
          test -s "$NEW_RAW/ARE-Konsultationsinzidenz.tsv"

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # Installs jsonlite and rsurvstat (and its dependencies, e.g. sf) as binaries and caches them
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::rsurvstat
          cache-version: 1

      - name: Build the JSON (to a temp file first)
        run: Rscript scripts/process_data.R "$NEW_RAW" /tmp/your-data.json

      - name: Check whether the data changed
        id: changed
        run: |
          if [ "${{ inputs.force }}" != "true" ] && [ -f "$PROCESSED_DIR/your-data.json" ] && cmp -s /tmp/your-data.json "$PROCESSED_DIR/your-data.json"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Processed data unchanged, nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive the old JSON and install the new files
        if: steps.changed.outputs.changed == 'true'
        run: |
          mkdir -p "$RAW_DIR" "$PAST_DIR" "$PROCESSED_DIR"
          DATE=$(date +%d.%m.%Y)
          if [ -f "$PROCESSED_DIR/your-data.json" ]; then
            mv "$PROCESSED_DIR/your-data.json" "$PAST_DIR/data-$DATE.json"
          fi
          cp "$NEW_RAW"/* "$RAW_DIR/"
          cp /tmp/your-data.json "$PROCESSED_DIR/your-data.json"

      - name: Commit and push
        if: steps.changed.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$RAW_DIR" "$PROCESSED_DIR" "$PAST_DIR"
          git diff --cached --quiet || git commit -m "Update data $(date +%d.%m.%Y)"
          git push

      - name: Trigger deploy
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref "${{ github.ref_name }}"