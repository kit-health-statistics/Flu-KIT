name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run build

      - name: Encrypt index.html with StatiCrypt
        working-directory: app/dist
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
          STATICRYPT_SALT: ${{ secrets.STATICRYPT_SALT }}
        run: |
          npx --yes staticrypt@3 index.html \
            -p "$SITE_PASSWORD" \
            --salt "$STATICRYPT_SALT" \
            --short \
            --remember 7 \
            --template-title "Flu@KIT" \
            --template-instructions "Please enter the password to continue." \
            -d encrypted
          mv encrypted/index.html index.html
          rmdir encrypted
          rm -f .staticrypt.json
          # SPA fallback (now encrypted too), so /forecastle also asks for the password
          cp index.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4